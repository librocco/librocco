#@ load("github.lib.yml", "checkout")
#@ load("cache.lib.yml", "cache_node")
#@ load("cache.lib.yml", "cache_playwright")
#@ load("rush.lib.yml", "rush_add_path")
#@ load("rush.lib.yml", "rush_install")
#@ load("rush.lib.yml", "rush_build")

name: PlaywrightMatrix

"on":
  push:
    branches:
      - "playwright-matrix/**"

  schedule:
    - cron: "30 5 * * 1,3"

jobs:
  e2e-test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dummy1: [1, 2, 3, 4, 5, 6]
        dummy2: [1, 2, 3, 4, 5, 6]
    steps:
      -  #@ checkout()
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      -  #@ cache_node()
      -  #@ rush_add_path()
      -  #@ rush_install()
      -  #@ rush_build()
      - name: Build the app
        run: cd apps/web-client && rushx build:e2e
      - name: Restructure build for /preview base path
        run: |
          cd apps/web-client
          mkdir preview
          mv build/* preview/
          mv preview build/
      -  #@ cache_playwright()
      - name: Download playwright browsers
        run: cd apps/e2e && npx playwright install chromium firefox
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.11"
          enable-cache: true
          working-directory: python-apps/launcher
      - name: Pre-install Python interpreter (retry transient download failures)
        working-directory: python-apps/launcher
        run: |
          # uv otherwise downloads the standalone CPython lazily when the launcher starts; a transient
          # GitHub 504 there leaves the sync server unstarted and fails "Wait for services". Fetch it
          # here, up front and with retries (and cached), so the launcher start is offline-fast.
          for i in 1 2 3 4 5; do
            if uv python install; then echo "Python interpreter ready"; exit 0; fi
            echo "uv python install failed (attempt $i/5); retrying in $((i * 5))s"
            sleep $((i * 5))
          done
          echo "Failed to install the Python interpreter after 5 attempts"
          exit 1
      - name: Clean stale test DBs (fix schema mismatch)
        run: rm -rf apps/sync-server/test-dbs && mkdir -p apps/sync-server/test-dbs
      - name: Start headless launcher in background
        run: |
          mkdir -p ~/.local/share/librocco-launcher/logs
          uv run --directory python-apps/launcher python main_headless.py 2>&1 | tee ~/.local/share/librocco-launcher/logs/headless.log &
          echo $! > /tmp/launcher.pid
          echo "Started launcher (PID: $(cat /tmp/launcher.pid))"
      - name: Wait for services to be ready
        run: |
          echo "Waiting for sync server..."
          timeout 30 bash -c 'until curl -f http://127.0.0.1:3000/ 2>/dev/null; do sleep 1; done'
          echo "Waiting for Caddy/web app..."
          timeout 30 bash -c 'until curl -f -k https://localhost:8433/preview/ 2>/dev/null; do sleep 1; done'
          echo "All services ready!"
      - name: Run Playwright tests
        run: cd apps/e2e && rushx test:ci
        #! Match the per-shard worker count so this flakiness harness validates
        #! the real PLAYWRIGHT_WORKERS config used by the e2e-test job.
        env:
          PLAYWRIGHT_WORKERS: "2"
      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/launcher.pid ]; then kill $(cat /tmp/launcher.pid) || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results-${{ matrix.dummy1 }}-${{ matrix.dummy2 }}
          path: apps/e2e/test-results
          retention-days: 30
